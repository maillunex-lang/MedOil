name: Monorepo scaffold
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (monorepo manifest)
        run: python3 -m unittest discover -s contracts/monorepo -p 'test_*.py' -v
      - name: Unit tests (economic types)
        run: python3 -m unittest discover -s contracts/economy -p 'test_*.py' -v
      - name: Validate on-disk scaffold
        run: python3 contracts/monorepo/validate.py