name: Roadmap
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/work_plan.py validate
      - run: python tools/work_plan.py build
      - run: git diff --exit-code -- docs/ROADMAP.md
